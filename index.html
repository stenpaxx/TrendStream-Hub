/* ---------- Supabase ---------- */
const SB_URL = 'https://mtkyqxqquqoiwbubjqnj.supabase.co';
const SB_KEY = 'sb_publishable_Fa0zxNJBLViN1PeVCk6bsw_1Z8KvGbv'; // chiave pubblica: la sicurezza è garantita dalle regole RLS
const sb = window.supabase.createClient(SB_URL, SB_KEY);
const uid = () => Math.random().toString(36).substring(2, 9);
const fromRow = (r) => ({
  id: r.id, title: r.title, category: r.category, videoUrl: r.video_url, thumbnailUrl: r.thumbnail_url || '',
  trendPercentage: r.trend_percentage || 'Nuovo', duration: r.duration || '—', personalNotes: r.personal_notes || '',
  timestamps: r.timestamps || [], isBookmarked: r.is_bookmarked,
});
function useStore() {
  const [videos, setVideos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  useEffect(() => {
    sb.from('videos').select('*').order('created_at', { ascending: false }).then(({ data, error }) => {
      if (error) setError('Impossibile caricare i video.'); else setVideos(data.map(fromRow));
      setLoading(false);
    });
  }, []);
  const local = (id, fn) => setVideos(vs => vs.map(v => v.id === id ? fn(v) : v));
  const upd = async (id, fields, msg) => { const { error } = await sb.from('videos').update(fields).eq('id', id); if (error) setError(msg); };
  return {
    videos, loading, error, clearError: () => setError(''),
    add: async (d) => {
      const { data, error } = await sb.from('videos').insert({
        title: d.title, category: d.category, video_url: d.videoUrl, thumbnail_url: d.thumbnailUrl || null,
        trend_percentage: d.trendPercentage, duration: d.duration, personal_notes: d.personalNotes || '',
      }).select().single();
      if (error) return setError('Impossibile salvare il video.');
      setVideos(vs => [fromRow(data), ...vs]);
    },
    remove: async (id) => {
      const prev = videos; setVideos(vs => vs.filter(v => v.id !== id));
      const { error } = await sb.from('videos').delete().eq('id', id);
      if (error) { setVideos(prev); setError('Impossibile eliminare il video.'); }
    },
    setNotes: (id, n) => { local(id, v => ({ ...v, personalNotes: n })); return upd(id, { personal_notes: n }, 'Impossibile salvare le note.'); },
    addTs: (id, time, label) => {
      const next = [...videos.find(x => x.id === id).timestamps, { id: uid(), time, label }];
      local(id, v => ({ ...v, timestamps: next })); return upd(id, { timestamps: next }, 'Impossibile salvare il timestamp.');
    },
    removeTs: (id, tid) => {
      const next = videos.find(x => x.id === id).timestamps.filter(t => t.id !== tid);
      local(id, v => ({ ...v, timestamps: next })); return upd(id, { timestamps: next }, 'Impossibile eliminare il timestamp.');
    },
  };
}

const inp = 'w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 mt-1 text-sm text-white';

const ytId = (url) => {
  try {
    const u = new URL(url.trim());
    if (u.hostname.includes('youtu.be')) return u.pathname.slice(1) || null;
    if (u.hostname.includes('youtube.com')) {
      if (u.searchParams.get('v')) return u.searchParams.get('v');
      const m = u.pathname.match(/\/(shorts|embed|live)\/([\w-]{6,})/);
      if (m) return m[2];
    }
  } catch (e) {}
  return null;
};
const validUrl = (s) => { try { return /^https?:$/.test(new URL(s.trim()).protocol); } catch (e) { return false; } };

function AddVideoModal({ category, onAdd, onClose }) {
  const [f, setF] = useState({ url: '', title: '', duration: '', category, notes: '' });
  const [err, setErr] = useState('');
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const id = ytId(f.url);
  useEffect(() => {
    if (!id) return;
    fetch('https://www.youtube.com/oembed?url=' + encodeURIComponent(f.url.trim()) + '&format=json')
      .then(r => r.ok ? r.json() : null).then(d => { if (d && d.title) setF(p => ({ ...p, title: p.title || d.title })); }).catch(() => {});
  }, [id]);
  const submit = () => {
    if (!validUrl(f.url)) return setErr('Inserisci un link valido (https://...).');
    if (!f.title.trim()) return setErr('Inserisci un titolo.');
    onAdd({
      title: f.title.trim(), category: f.category, videoUrl: f.url.trim(),
      thumbnailUrl: id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : '',
      trendPercentage: 'Nuovo', duration: f.duration.trim() || '—', personalNotes: f.notes.trim(), timestamps: [],
    });
    onClose();
  };
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-3 overflow-y-auto">
      <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-lg shadow-2xl text-slate-100">
        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-800">
          <h2 className="font-bold text-white">Aggiungi video da link</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-white p-1.5 rounded-lg bg-slate-800/50"><Icon n="x" c="w-5 h-5" /></button>
        </div>
        <div className="p-5 space-y-4">
          <div>
            <label className="text-xs text-slate-400">Link del video *</label>
            <input autoFocus value={f.url} onChange={set('url')} placeholder="https://www.youtube.com/watch?v=..." className={inp} />
            {f.url && <p className={`text-xs mt-1 ${id ? 'text-emerald-400' : 'text-slate-500'}`}>{id ? `YouTube riconosciuto (ID: ${id})` : 'Link generico: verrà salvato così com’è.'}</p>}
          </div>
          <div><label className="text-xs text-slate-400">Titolo *</label><input value={f.title} onChange={set('title')} className={inp} /></div>
          <div className="grid grid-cols-2 gap-3">
            <div><label className="text-xs text-slate-400">Durata</label><input value={f.duration} onChange={set('duration')} placeholder="12:30" className={inp} /></div>
            <div><label className="text-xs text-slate-400">Categoria</label>
              <select value={f.category} onChange={set('category')} className={inp}>{CATEGORIES.map(c => <option key={c.key} value={c.key}>{c.label}</option>)}</select></div>
          </div>
          <div><label className="text-xs text-slate-400">Note</label><textarea rows={2} value={f.notes} onChange={set('notes')} className={inp + ' resize-none'} /></div>
          {err && <p className="text-xs text-red-400">{err}</p>}
          <button onClick={submit} className="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold py-2.5 rounded-xl text-sm">Salva video</button>
        </div>
      </div>
    </div>
  );
}

  const m = {};
  videos.forEach(v => {
    new Set((String(v.title || '').toLowerCase().match(/#?[\p{L}\p{N}]{4,}/gu)) || []).forEach(t => {
      const k = t.replace(/^#/, '');
      if (STOP.has(k) || /^\d+$/.test(k)) return;
      m[k] = m[k] || { n: 0, s: 0 }; m[k].n++; m[k].s += (v.viewsPerDay || 0) + 1;
    });
  });
  let e = Object.entries(m); const multi = e.filter(x => x[1].n >= 2);
  if (multi.length >= 3) e = multi;
  return e.sort((a, b) => b[1].s - a[1].s).slice(0, 8).map(x => x[0]);
}
function Md({ text }) {
  const clean = (s) => s.replace(/\*\*/g, '').replace(/`/g, '').trim();
  const lines = text.split('\n'); const out = []; let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = rows.filter(r => !/^\s*\|[\s:|-]+\|?\s*$/.test(r)).map(r => r.trim().replace(/^\||\|$/g, '').split('|').map(clean));
      out.push(
        <div key={'t' + i} className="overflow-x-auto">
          <table className="w-full text-xs border-collapse"><tbody>
            {cells.map((r, ri) => <tr key={ri} className={ri === 0 ? 'font-bold text-white' : ''}>{r.map((c, ci) => <td key={ci} className="border border-slate-800 px-2 py-1.5 align-top">{c}</td>)}</tr>)}
          </tbody></table>
        </div>
      );
      continue;
    }
    if (l.trim()) {
      if (/^#{1,4}\s/.test(l)) out.push(<h4 key={i} className="pt-3 font-bold text-white">{clean(l.replace(/^#{1,4}\s/, ''))}</h4>);
      else if (/^\s*[-*]\s/.test(l)) out.push(<p key={i} className="pl-3">• {clean(l.replace(/^\s*[-*]\s/, ''))}</p>);
      else out.push(<p key={i}>{clean(l)}</p>);
    }
    i++;
  }
  return <div className="space-y-1.5 text-sm text-slate-200">{out}</div>;
}

const fmtN = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + ' Mln' : n >= 1e3 ? Math.round(n / 1e3) + ' K' : String(n);

function TrendingFeed({ category, store, onVideos }) {
  const [st, setSt] = useState({ status: 'loading', videos: [], updatedAt: '' });
  const [tick, setTick] = useState(0);
  useEffect(() => {
    let off = false;
    setSt({ status: 'loading', videos: [], updatedAt: '' });
    if (onVideos) onVideos([]);
    fetch('/api/trending?category=' + encodeURIComponent(category))
      .then(async r => { const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(r.status === 404 ? 'missing_key' : d.error || 'error'); return d; })
      .then(d => { if (!off) { setSt({ status: 'ok', videos: d.videos, updatedAt: d.updatedAt }); if (onVideos) onVideos(d.videos); } })
      .catch(e => { if (!off) setSt({ status: e.message === 'missing_key' ? 'nokey' : 'error', videos: [], updatedAt: '' }); });
    return () => { off = true; };
  }, [category, tick]);
  const saved = new Set(store.videos.map(v => v.videoUrl));
  const save = (v) => store.add({ title: v.title, category, videoUrl: v.videoUrl, thumbnailUrl: v.thumbnailUrl, trendPercentage: fmtN(v.viewsPerDay) + '/giorno', duration: v.duration, personalNotes: '' });
  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between gap-3">
        <h3 className="text-base font-bold text-white flex items-center gap-2"><Icon n="flame" c="w-4 h-4 text-orange-400" /> In tendenza ora in Italia</h3>
        <button onClick={() => setTick(t => t + 1)} className="text-xs text-slate-400 hover:text-white flex items-center gap-1.5"><Icon n="refresh" c="w-3.5 h-3.5" /> Aggiorna</button>

      {st.status === 'loading' && <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">{[0, 1, 2].map(i => <div key={i} className="h-56 rounded-2xl bg-slate-900/60 border border-slate-800 animate-pulse" />)}</div>}

      {st.status === 'error' && <div className="bg-red-500/10 border border-red-500/30 text-red-300 text-sm rounded-xl p-4">Non riesco a leggere le tendenze in questo momento. Riprova tra poco con “Aggiorna”.</div>}
      {st.status === 'ok' && st.videos.length === 0 && <p className="text-sm text-slate-500">Nessun video trovato per questa categoria.</p>}
      {st.status === 'ok' && st.videos.length > 0 && (
        <div className="grid grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-3">
          {st.videos.map((v, i) => (
            <div key={v.id} className="bg-slate-900/60 border border-slate-800 rounded-2xl overflow-hidden flex flex-col">
              <a href={v.videoUrl} target="_blank" rel="noopener noreferrer" className="relative block aspect-video bg-slate-800">
                {v.thumbnailUrl && <img src={v.thumbnailUrl} alt="" loading="lazy" className="absolute inset-0 w-full h-full object-cover" />}
                <span className="absolute top-2 left-2 text-[10px] font-bold bg-slate-950/80 text-white px-2 py-0.5 rounded">#{i + 1}</span>
                <span className="absolute bottom-2 right-2 text-[10px] font-bold bg-slate-950/80 text-white px-2 py-0.5 rounded">{v.duration}</span>
              </a>
              <div className="p-4 flex-1 flex flex-col justify-between gap-3">
                <div>
                  <h4 className="text-sm font-bold text-white line-clamp-2">{v.title}</h4>
                  <p className="text-xs text-slate-400 mt-1 truncate">{v.channel}</p>
                </div>
                <div className="flex items-center justify-between gap-2 flex-wrap">
                  <div className="flex items-center gap-2 text-[10px] font-bold flex-wrap">
                    <span className="bg-orange-500/15 text-orange-300 px-2 py-0.5 rounded">🔥 {fmtN(v.viewsPerDay)}/giorno</span>
                    <span className="text-slate-500">{fmtN(v.views)} views</span>

                  <button disabled={saved.has(v.videoUrl)} onClick={() => save(v)} className="text-xs font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1.5 bg-cyan-500/10 text-cyan-400 hover:bg-cyan-500/20 disabled:opacity-50 disabled:cursor-default"><Icon n={saved.has(v.videoUrl) ? 'check' : 'bookmark'} c="w-3.5 h-3.5" />{saved.has(v.videoUrl) ? 'Salvato' : 'Salva'}</button>

function AuthScreen() {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [msg, setMsg] = useState({ type: '', text: '' });
  const [busy, setBusy] = useState(false);
  const submit = async (e) => {
    e.preventDefault(); setMsg({ type: '', text: '' });
    if (password.length < 6) return setMsg({ type: 'err', text: 'La password deve avere almeno 6 caratteri.' });
    setBusy(true);
    const { data, error } = mode === 'login' ? await sb.auth.signInWithPassword({ email, password }) : await sb.auth.signUp({ email, password });
    setBusy(false);
    if (error) return setMsg({ type: 'err', text: error.message });
    if (mode === 'signup' && !data.session) setMsg({ type: 'ok', text: 'Registrazione riuscita! Controlla la tua email, clicca sul link di conferma e poi accedi.' });
  };
  return (
    <div className="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
      <form onSubmit={submit} className="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-2xl">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center"><Icon n="sparkles" c="w-5 h-5 text-white" /></div>
          <div><h1 className="font-bold text-lg text-white">TrendStream</h1><p className="text-xs text-slate-400">{mode === 'login' ? 'Accedi al tuo hub' : 'Crea il tuo account'}</p></div>
        </div>
        <div><label className="text-xs text-slate-400">Email</label><input type="email" required value={email} onChange={e => setEmail(e.target.value)} className={inp} /></div>
        <div><label className="text-xs text-slate-400">Password</label><input type="password" required value={password} onChange={e => setPassword(e.target.value)} className={inp} /></div>
        {msg.text && <p className={`text-xs ${msg.type === 'err' ? 'text-red-400' : 'text-emerald-400'}`}>{msg.text}</p>}
        <button disabled={busy} className="w-full bg-cyan-500 hover:bg-cyan-400 disabled:opacity-50 text-slate-950 font-semibold py-2.5 rounded-xl text-sm">{busy ? 'Attendi...' : mode === 'login' ? 'Accedi' : 'Registrati'}</button>

      </form>
    </div>
  );
}

}
