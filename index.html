/* ---------- Supabase ---------- */
const SB_URL = 'https://mtkyqxqquqoiwbubjqnj.supabase.co';
const SB_KEY = 'sb_publishable_Fa0zxNJBLViN1PeVCk6bsw_1Z8KvGbv'; // chiave pubblica: la sicurezza è garantita dalle regole RLS
const sb = window.supabase.createClient(SB_URL, SB_KEY);
const uid = () => Math.random().toString(36).substring(2, 9);
const fromRow = (r) => ({
  id: r.id, title: r.title, category: r.category, videoUrl: r.video_url, thumbnailUrl: r.thumbnail_url || '',
  trendPercentage: r.trend_percentage || 'Nuovo', duration: r.duration || '—', personalNotes: r.personal_notes || '',
  timestamps: r.timestamps || [], isBookmarked: r.is_bookmarked,
});
function useStore() {
  const [videos, setVideos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  useEffect(() => {
    sb.from('videos').select('*').order('created_at', { ascending: false }).then(({ data, error }) => {
      if (error) setError('Impossibile caricare i video.'); else setVideos(data.map(fromRow));
      setLoading(false);
    });
  }, []);
  const local = (id, fn) => setVideos(vs => vs.map(v => v.id === id ? fn(v) : v));
  const upd = async (id, fields, msg) => { const { error } = await sb.from('videos').update(fields).eq('id', id); if (error) setError(msg); };
  return {
    videos, loading, error, clearError: () => setError(''),
    add: async (d) => {
      const { data, error } = await sb.from('videos').insert({
        title: d.title, category: d.category, video_url: d.videoUrl, thumbnail_url: d.thumbnailUrl || null,
        trend_percentage: d.trendPercentage, duration: d.duration, personal_notes: d.personalNotes || '',
      }).select().single();
      if (error) return setError('Impossibile salvare il video.');
      setVideos(vs => [fromRow(data), ...vs]);
    },
    remove: async (id) => {
      const prev = videos; setVideos(vs => vs.filter(v => v.id !== id));
      const { error } = await sb.from('videos').delete().eq('id', id);
      if (error) { setVideos(prev); setError('Impossibile eliminare il video.'); }
    },
    setNotes: (id, n) => { local(id, v => ({ ...v, personalNotes: n })); return upd(id, { personal_notes: n }, 'Impossibile salvare le note.'); },
    addTs: (id, time, label) => {
      const next = [...videos.find(x => x.id === id).timestamps, { id: uid(), time, label }];
      local(id, v => ({ ...v, timestamps: next })); return upd(id, { timestamps: next }, 'Impossibile salvare il timestamp.');
    },
    removeTs: (id, tid) => {
      const next = videos.find(x => x.id === id).timestamps.filter(t => t.id !== tid);
      local(id, v => ({ ...v, timestamps: next })); return upd(id, { timestamps: next }, 'Impossibile eliminare il timestamp.');
    },
  };
}

            </div>
            <div className="space-y-3 bg-slate-950/50 border border-slate-800/80 rounded-2xl p-4">
              <div className="flex items-center justify-between">
                <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1.5"><Icon n="edit" c="w-3.5 h-3.5 text-cyan-400" /> Note Personali</label>
                <button onClick={save} className="text-xs bg-cyan-500/10 text-cyan-400 px-3 py-1 rounded-lg font-semibold flex items-center gap-1">
                  <Icon n={saved ? 'check' : 'sparkles'} c={`w-3.5 h-3.5 ${saved ? 'text-emerald-400' : ''}`} /> {saved ? 'Salvato!' : 'Salva'}
                </button>
              </div>
              <textarea value={notes} onChange={e => setNotes(e.target.value)} rows={3} className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 resize-none" />
            </div>
          </div>
          <div className="p-5 flex flex-col space-y-5 bg-slate-950/30">
            <h3 className="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2"><Icon n="clock" c="w-4 h-4 text-cyan-400" /> Timestamp Chiave</h3>
            <div className="space-y-2.5 max-h-56 overflow-y-auto pr-1">
              {video.timestamps.map(ts => (
                <div key={ts.id} className="bg-slate-900 border border-slate-800 rounded-xl p-3 flex items-center justify-between gap-3">
                  <div className="flex items-center gap-3">

                    <span className="text-sm text-slate-200">{ts.label}</span>
                  </div>

                </div>
              ))}
            </div>
            <div className="pt-4 border-t border-slate-800 space-y-3 mt-auto">
              <div className="grid grid-cols-3 gap-2">
                <input placeholder="02:15" value={time} onChange={e => setTime(e.target.value)} className="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 text-center font-mono" />

const ytId = (url) => {
  try {
    const u = new URL(url.trim());
    if (u.hostname.includes('youtu.be')) return u.pathname.slice(1) || null;
    if (u.hostname.includes('youtube.com')) {
      if (u.searchParams.get('v')) return u.searchParams.get('v');
      const m = u.pathname.match(/\/(shorts|embed|live)\/([\w-]{6,})/);
      if (m) return m[2];
    }
  } catch (e) {}
  return null;
};
const validUrl = (s) => { try { return /^https?:$/.test(new URL(s.trim()).protocol); } catch (e) { return false; } };

function AddVideoModal({ category, onAdd, onClose }) {
  const [f, setF] = useState({ url: '', title: '', duration: '', category, notes: '' });
  const [err, setErr] = useState('');
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const id = ytId(f.url);
  useEffect(() => {
    if (!id) return;
    fetch('https://www.youtube.com/oembed?url=' + encodeURIComponent(f.url.trim()) + '&format=json')
      .then(r => r.ok ? r.json() : null).then(d => { if (d && d.title) setF(p => ({ ...p, title: p.title || d.title })); }).catch(() => {});
  }, [id]);
  const submit = () => {
    if (!validUrl(f.url)) return setErr('Inserisci un link valido (https://...).');
    if (!f.title.trim()) return setErr('Inserisci un titolo.');
    onAdd({
      title: f.title.trim(), category: f.category, videoUrl: f.url.trim(),
      thumbnailUrl: id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : '',
      trendPercentage: 'Nuovo', duration: f.duration.trim() || '—', personalNotes: f.notes.trim(), timestamps: [],
    });
    onClose();
  };
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-3 overflow-y-auto">
      <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-lg shadow-2xl text-slate-100">
        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-800">
          <h2 className="font-bold text-white">Aggiungi video da link</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-white p-1.5 rounded-lg bg-slate-800/50"><Icon n="x" c="w-5 h-5" /></button>
        </div>
        <div className="p-5 space-y-4">
          <div>
            <label className="text-xs text-slate-400">Link del video *</label>
            <input autoFocus value={f.url} onChange={set('url')} placeholder="https://www.youtube.com/watch?v=..." className={inp} />
            {f.url && <p className={`text-xs mt-1 ${id ? 'text-emerald-400' : 'text-slate-500'}`}>{id ? `YouTube riconosciuto (ID: ${id})` : 'Link generico: verrà salvato così com’è.'}</p>}
          </div>
          <div><label className="text-xs text-slate-400">Titolo *</label><input value={f.title} onChange={set('title')} className={inp} /></div>
          <div className="grid grid-cols-2 gap-3">
            <div><label className="text-xs text-slate-400">Durata</label><input value={f.duration} onChange={set('duration')} placeholder="12:30" className={inp} /></div>
            <div><label className="text-xs text-slate-400">Categoria</label>
              <select value={f.category} onChange={set('category')} className={inp}>{CATEGORIES.map(c => <option key={c.key} value={c.key}>{c.label}</option>)}</select></div>
          </div>
          <div><label className="text-xs text-slate-400">Note</label><textarea rows={2} value={f.notes} onChange={set('notes')} className={inp + ' resize-none'} /></div>
          {err && <p className="text-xs text-red-400">{err}</p>}
          <button onClick={submit} className="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold py-2.5 rounded-xl text-sm">Salva video</button>
        </div>
      </div>
    </div>
  );
}
function Thumb({ v }) {
  const [bad, setBad] = useState(false);
  return (
    <div className={`relative overflow-hidden h-24 bg-gradient-to-br ${gradOf(v.category)} flex items-center justify-center`}>
      {v.thumbnailUrl && !bad && <img src={v.thumbnailUrl} onError={() => setBad(true)} className="absolute inset-0 w-full h-full object-cover" alt="" />}
      <Icon n="play" c="relative w-7 h-7 text-white/80" />
    </div>
  );
}

const fmtN = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + ' Mln' : n >= 1e3 ? Math.round(n / 1e3) + ' K' : String(n);

function TrendingFeed({ category, store }) {
  const [st, setSt] = useState({ status: 'loading', videos: [], updatedAt: '' });
  const [tick, setTick] = useState(0);
  useEffect(() => {
    let off = false;
    setSt({ status: 'loading', videos: [], updatedAt: '' });
    fetch('/api/trending?category=' + encodeURIComponent(category))
      .then(async r => { const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(r.status === 404 ? 'missing_key' : d.error || 'error'); return d; })
      .then(d => { if (!off) setSt({ status: 'ok', videos: d.videos, updatedAt: d.updatedAt }); })
      .catch(e => { if (!off) setSt({ status: e.message === 'missing_key' ? 'nokey' : 'error', videos: [], updatedAt: '' }); });
    return () => { off = true; };
  }, [category, tick]);
  const saved = new Set(store.videos.map(v => v.videoUrl));
  const save = (v) => store.add({ title: v.title, category, videoUrl: v.videoUrl, thumbnailUrl: v.thumbnailUrl, trendPercentage: fmtN(v.viewsPerDay) + '/giorno', duration: v.duration, personalNotes: '' });
  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between gap-3">
        <h3 className="text-base font-bold text-white flex items-center gap-2"><Icon n="flame" c="w-4 h-4 text-orange-400" /> In tendenza ora in Italia</h3>
        <button onClick={() => setTick(t => t + 1)} className="text-xs text-slate-400 hover:text-white flex items-center gap-1.5"><Icon n="refresh" c="w-3.5 h-3.5" /> Aggiorna</button>
      </div>
      {st.status === 'loading' && <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">{[0, 1, 2].map(i => <div key={i} className="h-56 rounded-2xl bg-slate-900/60 border border-slate-800 animate-pulse" />)}</div>}
      {st.status === 'nokey' && <div className="bg-amber-500/10 border border-amber-500/30 text-amber-200 text-sm rounded-xl p-4">Il feed automatico non è ancora attivo: manca la chiave YouTube nelle impostazioni di Vercel.</div>}
      {st.status === 'error' && <div className="bg-red-500/10 border border-red-500/30 text-red-300 text-sm rounded-xl p-4">Non riesco a leggere le tendenze in questo momento. Riprova tra poco con “Aggiorna”.</div>}
      {st.status === 'ok' && st.videos.length === 0 && <p className="text-sm text-slate-500">Nessun video trovato per questa categoria.</p>}
      {st.status === 'ok' && st.videos.length > 0 && (
        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
          {st.videos.map((v, i) => (
            <div key={v.id} className="bg-slate-900/60 border border-slate-800 rounded-2xl overflow-hidden flex flex-col">
              <a href={v.videoUrl} target="_blank" rel="noopener noreferrer" className="relative block aspect-video bg-slate-800">
                {v.thumbnailUrl && <img src={v.thumbnailUrl} alt="" loading="lazy" className="absolute inset-0 w-full h-full object-cover" />}
                <span className="absolute top-2 left-2 text-[10px] font-bold bg-slate-950/80 text-white px-2 py-0.5 rounded">#{i + 1}</span>
                <span className="absolute bottom-2 right-2 text-[10px] font-bold bg-slate-950/80 text-white px-2 py-0.5 rounded">{v.duration}</span>
              </a>
              <div className="p-4 flex-1 flex flex-col justify-between gap-3">
                <div>
                  <h4 className="text-sm font-bold text-white line-clamp-2">{v.title}</h4>
                  <p className="text-xs text-slate-400 mt-1 truncate">{v.channel}</p>
                </div>
                <div className="flex items-center justify-between gap-2">
                  <div className="flex items-center gap-2 text-[10px] font-bold">
                    <span className="bg-orange-500/15 text-orange-300 px-2 py-0.5 rounded">🔥 {fmtN(v.viewsPerDay)}/giorno</span>
                    <span className="text-slate-500">{fmtN(v.views)} views</span>
                  </div>
                  <button disabled={saved.has(v.videoUrl)} onClick={() => save(v)} className="text-xs font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1.5 bg-cyan-500/10 text-cyan-400 hover:bg-cyan-500/20 disabled:opacity-50 disabled:cursor-default"><Icon n={saved.has(v.videoUrl) ? 'check' : 'bookmark'} c="w-3.5 h-3.5" />{saved.has(v.videoUrl) ? 'Salvato' : 'Salva'}</button>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------- App ---------- */
function App() {
  const store = useStore();
  const [active, setActive] = useState('Fitness');
  const [query, setQuery] = useState('');
  const [openId, setOpenId] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const meta = CATEGORIES.find(c => c.key === active);
  const q = query.trim().toLowerCase();
  const list = store.videos.filter(v => v.category === active && (!q || v.title.toLowerCase().includes(q) || (v.personalNotes || '').toLowerCase().includes(q)));
  const openVideo = store.videos.find(v => v.id === openId);

  const addSample = () => store.add({
    title: `Trend Globale in ${active} (Sincronizzato)`, category: active, videoUrl: 'https://www.youtube.com',
    trendPercentage: '+450%', duration: '12:30', personalNotes: 'Nota salvata automaticamente dai feed di tendenza.',
    timestamps: [{ id: uid(), time: '01:00', label: 'Punto chiave iniziale' }],
  });

  const widget = {
    Fitness: <KelliGenWidget />, Finanza: <FinancialDecoderWidget />, DIY: <MaterialCutWidget />,
    Kids: <AiViralEngine />, Architettura: <ArchitectureVisualizerWidget />,
    Tech: <TechWidget />, Musica: <MusicWidget />, Ingegneria: <EngineeringWidget />,
  }[active] || (
    <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-10 text-center space-y-2">
      <h3 className="text-xl font-bold text-white">Dashboard Dedicata: {meta.label}</h3>
      <p className="text-xs text-slate-400">Organizza e analizza i video di tendenza globali per questa categoria.</p>
    </div>
  );

  return (
    <div className="min-h-screen bg-slate-950 text-slate-100 flex selection:bg-cyan-500 selection:text-slate-950">
      <aside className="w-72 border-r border-slate-800 bg-slate-900/40 p-6 hidden lg:flex flex-col sticky top-0 h-screen">
        <div className="flex items-center gap-3 mb-8">
          <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-cyan-500/20"><Icon n="sparkles" c="w-5 h-5 text-white" /></div>
          <div><h1 className="font-bold text-lg text-white">TrendStream</h1><p className="text-xs text-slate-400">Intelligence Video Hub</p></div>
        </div>
        <nav className="space-y-1 overflow-y-auto pr-1">
          {CATEGORIES.map(c => (
            <button key={c.key} onClick={() => setActive(c.key)} className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all ${active === c.key ? 'bg-gradient-to-r from-cyan-500/20 to-indigo-500/10 text-cyan-400 border border-cyan-500/30' : 'text-slate-400 hover:bg-slate-900'}`}>
              <div className="flex items-center gap-3"><Icon n={c.icon} /><span>{c.label}</span></div>
              
            </button>
          ))}
        </nav>
      </aside>

      <main className="flex-1 flex flex-col min-h-screen min-w-0">
        <header className="border-b border-slate-800 bg-slate-950/90 backdrop-blur-md px-4 md:px-8 py-4 sticky top-0 z-20 space-y-3">
          <div className="flex items-center justify-between gap-3">
            <h2 className="text-lg md:text-xl font-bold text-white flex items-center gap-2 min-w-0"><Icon n={meta.icon} c="w-5 h-5 shrink-0" /> <span className="truncate">{meta.label}</span></h2>
            <div className="flex items-center gap-3">
              <div className="relative hidden md:block">
                <span className="text-slate-500 absolute left-3 top-1/2 -translate-y-1/2"><Icon n="search" /></span>
                <input placeholder="Cerca tra i video..." value={query} onChange={e => setQuery(e.target.value)} className="bg-slate-900 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 w-64" />
              </div>
              <button onClick={() => setShowAdd(true)} className="bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-700 font-semibold px-3 md:px-4 py-2 rounded-xl text-sm flex items-center gap-2 whitespace-nowrap"><Icon n="plus" /> <span className="hidden sm:inline">Aggiungi da link</span></button>
              <button onClick={() => sb.auth.signOut()} title="Esci" className="p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-white"><Icon n="logout" /></button>
            </div>
          </div>
          <div className="lg:hidden flex gap-2 overflow-x-auto pb-1">
            {CATEGORIES.map(c => (
              <button key={c.key} onClick={() => setActive(c.key)} className={`shrink-0 flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium border ${active === c.key ? 'bg-cyan-500/15 text-cyan-400 border-cyan-500/30' : 'text-slate-400 border-slate-800 bg-slate-900'}`}><Icon n={c.icon} c="w-3.5 h-3.5" />{c.key}</button>
            ))}
          </div>
          <div className="relative md:hidden">
            <span className="text-slate-500 absolute left-3 top-1/2 -translate-y-1/2"><Icon n="search" /></span>
            <input placeholder="Cerca tra i video..." value={query} onChange={e => setQuery(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-500" />
          </div>
        </header>

        <div className="p-4 md:p-8 space-y-8 flex-1">
          {store.error && <div onClick={store.clearError} className="bg-red-500/10 border border-red-500/30 text-red-300 text-sm rounded-xl p-3 cursor-pointer">{store.error} (tocca per chiudere)</div>}
          <TrendingFeed category={active} store={store} />
          {widget}
          {store.loading && <p className="text-sm text-slate-400">Carico i tuoi video...</p>}

              <h3 className="text-base font-bold text-white flex items-center gap-2"><Icon n="bookmark" c="w-4 h-4 text-cyan-400" /> I tuoi video salvati ({list.length})</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                {list.map(v => (
                  <div key={v.id} onClick={() => setOpenId(v.id)} className="group relative bg-slate-900/60 border border-slate-800 rounded-2xl overflow-hidden hover:border-slate-700 transition-all cursor-pointer">
                    <Thumb v={v} />
                    <div className="p-4 space-y-2">
                      <div className="flex justify-between items-center">
                        <span className="text-[10px] bg-cyan-500/10 text-cyan-400 px-2 py-0.5 rounded font-bold">{v.duration}</span>
                        <span className="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded font-bold">{v.trendPercentage}</span>
                      </div>
                      <h4 className="text-sm font-bold text-white line-clamp-2">{v.title}</h4>
                      <p className="text-xs text-slate-400 line-clamp-2">{v.personalNotes}</p>
                    </div>
                    <button onClick={e => { e.stopPropagation(); store.remove(v.id); }} className="absolute top-2 right-2 p-1.5 rounded-lg bg-slate-950/70 text-slate-300 hover:text-red-400"><Icon n="trash" c="w-3.5 h-3.5" /></button>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      </main>
      {showAdd && <AddVideoModal category={active} onAdd={store.add} onClose={() => setShowAdd(false)} />}
      {openVideo && <VideoModal video={openVideo} store={store} onClose={() => setOpenId(null)} />}
    </div>
  );
}
function AuthScreen() {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [msg, setMsg] = useState({ type: '', text: '' });
  const [busy, setBusy] = useState(false);
  const submit = async (e) => {
    e.preventDefault(); setMsg({ type: '', text: '' });
    if (password.length < 6) return setMsg({ type: 'err', text: 'La password deve avere almeno 6 caratteri.' });
    setBusy(true);
    const { data, error } = mode === 'login' ? await sb.auth.signInWithPassword({ email, password }) : await sb.auth.signUp({ email, password });
    setBusy(false);
    if (error) return setMsg({ type: 'err', text: error.message });
    if (mode === 'signup' && !data.session) setMsg({ type: 'ok', text: 'Registrazione riuscita! Controlla la tua email, clicca sul link di conferma e poi accedi.' });
  };
  return (
    <div className="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
      <form onSubmit={submit} className="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-2xl">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center"><Icon n="sparkles" c="w-5 h-5 text-white" /></div>
          <div><h1 className="font-bold text-lg text-white">TrendStream</h1><p className="text-xs text-slate-400">{mode === 'login' ? 'Accedi al tuo hub' : 'Crea il tuo account'}</p></div>
        </div>
        <div><label className="text-xs text-slate-400">Email</label><input type="email" required value={email} onChange={e => setEmail(e.target.value)} className={inp} /></div>
        <div><label className="text-xs text-slate-400">Password</label><input type="password" required value={password} onChange={e => setPassword(e.target.value)} className={inp} /></div>
        {msg.text && <p className={`text-xs ${msg.type === 'err' ? 'text-red-400' : 'text-emerald-400'}`}>{msg.text}</p>}
        <button disabled={busy} className="w-full bg-cyan-500 hover:bg-cyan-400 disabled:opacity-50 text-slate-950 font-semibold py-2.5 rounded-xl text-sm">{busy ? 'Attendi...' : mode === 'login' ? 'Accedi' : 'Registrati'}</button>
        <button type="button" onClick={() => { setMode(mode === 'login' ? 'signup' : 'login'); setMsg({ type: '', text: '' }); }} className="w-full text-xs text-slate-400 hover:text-cyan-400">{mode === 'login' ? 'Non hai un account? Registrati' : 'Hai già un account? Accedi'}</button>
      </form>
    </div>
  );
}
function Root() {
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => data.subscription.unsubscribe();
  }, []);
  if (session === undefined) return <div className="min-h-screen flex items-center justify-center text-slate-300 text-sm">Caricamento...</div>;
  return session ? <App key={session.user.id} /> : <AuthScreen />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
